[project]
name = "artemis-ui"
version = "0.1.0"
description = "A stupidly easy way to build Android and desktop apps in Python, on top of Flet."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "flet>=0.86.0",
]

[project.optional-dependencies]
icons = ["pillow"]        # only needed to auto-convert a custom logo.png into logo.ico
charts = ["flet-charts"]  # only needed for art.LineChart / BarChart / PieChart

[project.scripts]
artemis = "artemis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["artemis*"]

[tool.setuptools.package-data]
artemis = ["assets/*.png", "assets/*.ico"]
