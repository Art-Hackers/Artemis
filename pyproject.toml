[project]
name = "artemis-ui"
version = "0.62.0"
description = "A stupidly easy way to build Android and desktop apps in Python, on top of Flet."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Art-Hackers" },
]
keywords = ["flet", "flutter", "gui", "android", "desktop", "app", "ui", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "flet>=0.86.0",
]

[project.optional-dependencies]
icons = ["pillow"]        # only needed to auto-convert a custom logo.png into logo.ico
charts = ["flet-charts"]  # only needed for art.LineChart / BarChart / PieChart
dev = ["pytest", "build", "twine"]

[project.scripts]
artemis = "artemis.cli:main"


[project.urls]
 Homepage = "https://github.com/Art-Hackers/Artemis"
 Documentation = "https://github.com/Art-Hackers/Artemis-Docs"
 Repository = "https://github.com/Art-Hackers/Artemis"
 Issues = "https://github.com/Art-Hackers/Artemis/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["artemis*"]

[tool.setuptools.package-data]
artemis = ["assets/*.png", "assets/*.ico"]

